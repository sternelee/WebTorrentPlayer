[package]
name = "torplay"
version = "0.1.0"
description = "P2P Streaming Player"
authors = ["Architect"]
edition = "2021"

[lib]
name = "torplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
mime_guess = "2"

# Async & Network
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# P2P Engine
librqbit = { version = "8.1", default-features = false, features = ["rust-tls"] }

# HTTP client (for search proxy + HTTP downloader)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }

# Utilities
anyhow = "1"
parking_lot = "0.12"
chrono = "0.4"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
libc = "0.2"

# Native mpv player
libmpv2 = "4"
libmpv2-sys = "4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSThread", "NSValue", "NSDictionary", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSOpenGL", "NSOpenGLView", "NSResponder"] }
core-foundation = "0.10"
core-video = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Threading"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
